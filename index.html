<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens de Naruto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="container">
        <header>
            <h1 class="title">Explore o universo de Naruto</h1>
            <p class="description">Descubra os personagens icônicos da série Naruto.</p>
            <label for="searchInput">Digite qualquer id (1 a 70) ou o nome de seu personagem</label>
            <form>
                <input type="text" id="searchInput" placeholder="Pesquisar personagem...">
                <button type="button" id="searchButton" onclick="characterSearch()">Pesquisar</button>
            </form>
        </header>
        <main>
            <div id="characterResult">
            </div>
        </main>
    </div>
</body>
</html>
